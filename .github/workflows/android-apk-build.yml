name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.${GITHUB_RUN_NUMBER}-ci"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (code $GITHUB_RUN_NUMBER)"
      - name: Build signed APK
        run: gradle assembleRelease -PappVersionName="${{ steps.ver.outputs.name }}" -PappVersionCode="${{ steps.ver.outputs.code }}"
      - name: Name the APK and show its signature
        run: |
          cp app/build/outputs/apk/release/app-release.apk "GatsMod-Cut-${{ steps.ver.outputs.name }}.apk"
          keytool -printcert -jarfile "GatsMod-Cut-${{ steps.ver.outputs.name }}.apk" | grep -E "Owner|SHA256"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GatsMod-Cut-APK
          path: GatsMod-Cut-*.apk
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GatsMod-Cut-*.apk
          generate_release_notes: true
          make_latest: true
